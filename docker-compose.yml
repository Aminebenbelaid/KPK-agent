services:
  kpk:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - kpk-data:/app/data
    environment:
      - TRACKER_DB_PATH=data/tracker.db
      - USER_PROFILE_PATH=data/user_profile.yaml
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-change-me-to-a-long-random-string}
      - KISSKI_API_KEY=${KISSKI_API_KEY:-}
      - ADMIN_KEY=${ADMIN_KEY:-}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --url http://kpk:8000
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - kpk
    restart: unless-stopped

volumes:
  kpk-data:
